# Nitro Rush — Production Nginx Reverse Proxy Configuration
# Architecture: Unified Edge Reverse Proxy for Frontend, Backend WebSockets & REST

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Authoritative Java Game Backend (Spring Boot on port 8080)
upstream backend_server {
    server backend:8080;
    keepalive 32;
}

# Frontend Web Application (Phaser 3 SPA on port 80)
upstream frontend_server {
    server frontend:80;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Let's Encrypt ACME Challenge location for Certbot verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS in production
    # (Uncomment after SSL certificates are issued via Certbot)
    # return 301 https://$host$request_uri;

    # Authoritative Backend Healthcheck Endpoint
    location /health {
        proxy_pass http://backend_server/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Authoritative Game WebSocket Endpoint (/ws/game)
    location /ws/game {
        proxy_pass http://backend_server/ws/game;
        proxy_http_version 1.1;

        # WebSocket Upgrade Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Real-time low-latency settings (no buffering, 1-hour idle timeout)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Frontend SPA and Static Assets (Proxied to frontend container)
    location / {
        proxy_pass http://frontend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
