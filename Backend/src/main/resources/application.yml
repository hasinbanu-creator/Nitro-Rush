server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: nitro-rush-backend
  lifecycle:
    timeout-per-shutdown-phase: 15s

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:nitro_rush}
    username: ${POSTGRES_USER:nitro}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
nitrorush:
  websocket:
    path: /ws/game
    allowed-origins:
      - ${PRODUCTION_ORIGIN:http://localhost}
      - http://localhost
      - http://127.0.0.1
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:3000
    heartbeat-interval-ms: 10000
    max-frame-size: 4096
  session:
    guest-token-prefix: GR-
    guest-token-entropy-bytes: 16
    session-timeout-minutes: 60

logging:
  level:
    root: INFO
    com.nitrorush.backend: INFO

---
spring:
  config:
    activate:
      on-profile: prod

nitrorush:
  websocket:
    allowed-origins:
      - ${PRODUCTION_ORIGIN:http://localhost}
      - http://localhost
      - http://127.0.0.1



